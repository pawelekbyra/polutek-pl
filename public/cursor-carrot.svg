    <line x1="11" y1="18" x2="21" y2="18" stroke="rgba(0,0,0,0.1)" stroke-width="0.8"/>
    <line x1="12" y1="21" x2="20" y2="21" stroke="rgba(0,0,0,0.1)" stroke-width="0.8"/>
