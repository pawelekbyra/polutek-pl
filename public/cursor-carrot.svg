<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Carrot cursor, drawn for this site. Like an arrow cursor: the sharp tip is the hotspot at
       (2, 2) in the top-left corner, the body runs down-right and the leaves end bottom-right.
       Dark outline + white halo keep it readable on light and dark backgrounds.
       CSS: cursor: url(/cursor-carrot.svg) 2 2, <fallback>; -->
  <g transform="translate(2 2) rotate(-45)" stroke-linejoin="round" stroke-linecap="round">
    <!-- leaves (behind the body), fanned out at the thick end -->
    <g fill="#22c55e" stroke="#14532d" stroke-width="1.1" paint-order="stroke">
      <path d="M-1.2 23.5 C-4.8 26 -7.2 29.4 -6 32.6 C-3.6 30.6 -1.8 27.2 -0.2 24.2 Z"/>
      <path d="M1.2 23.5 C4.8 26 7.2 29.4 6 32.6 C3.6 30.6 1.8 27.2 0.2 24.2 Z"/>
      <path d="M0 23.6 C-1.4 27.4 -1.2 31.4 0 34.4 C1.2 31.4 1.4 27.4 0 23.6 Z" fill="#16a34a"/>
    </g>
    <!-- white halo -->
    <path d="M0 0 C1.4 6 4.2 15.5 5.6 20.6 C6.2 23.4 3.2 25 0 25 C-3.2 25 -6.2 23.4 -5.6 20.6 C-4.2 15.5 -1.4 6 0 0 Z"
          fill="none" stroke="#ffffff" stroke-width="3.2"/>
    <!-- body -->
    <path d="M0 0 C1.4 6 4.2 15.5 5.6 20.6 C6.2 23.4 3.2 25 0 25 C-3.2 25 -6.2 23.4 -5.6 20.6 C-4.2 15.5 -1.4 6 0 0 Z"
          fill="#f97316" stroke="#7c2d12" stroke-width="1.2"/>
    <!-- highlight and ridges -->
    <path d="M-1.6 9 C-2.6 13 -3.4 17 -3.4 20.4" fill="none" stroke="#fed7aa" stroke-width="1.1" opacity="0.9"/>
    <path d="M0.6 8.5 L2.4 8.1 M-0.6 13.5 L3.6 12.9 M0.8 18 L4.6 17.4 M-2 21.4 L1.6 21" fill="none" stroke="#9a3412" stroke-width="0.9"/>
  </g>
</svg>
