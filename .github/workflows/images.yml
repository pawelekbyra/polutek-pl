name: images

# Build all five pinned images from a fully verified Git archive. No image is pushed before release verification.
on:
  workflow_dispatch:
  push:
    tags: ['deploy-*']

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: verify, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RELEASE_ROOT: ${{ runner.temp }}/polutek-release
      RELEASE_INPUTS: ${{ runner.temp }}/polutek-release-inputs.json
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_PREMIUM_PASS_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_PREMIUM_PASS_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_R2_PUBLIC_HOST: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_HOST }}
      NEXT_PUBLIC_BLOB_PUBLIC_HOST: ${{ vars.NEXT_PUBLIC_BLOB_PUBLIC_HOST }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_SITE_BETA: ${{ vars.NEXT_PUBLIC_SITE_BETA }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a commit already on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Image release must use a commit already merged to main.' >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the locked toolchain
        run: npm ci --no-audit --no-fund

      - uses: docker/setup-buildx-action@v3

      - name: Create pinned release inputs
        run: node scripts/ops/release-inputs.mjs --out="$RELEASE_INPUTS"

      - name: Run strict controls and build the five release images
        id: produce
        run: |
          result="$(node scripts/ops/release-produce.mjs \
            --revision="$GITHUB_SHA" \
            --inputs="$RELEASE_INPUTS" \
            --out="$RELEASE_ROOT")"
          proof_path="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).path)' "$result")"
          proof_sha="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).proof_sha256)' "$result")"
          printf 'proof_path=%s\nproof_sha=%s\n' "$proof_path" "$proof_sha" >> "$GITHUB_OUTPUT"

      - name: Verify source and all five local image identities
        run: |
          node scripts/ops/release-proof.mjs verify \
            --proof="${{ steps.produce.outputs.proof_path }}" \
            --proof-sha256="${{ steps.produce.outputs.proof_sha }}" \
            --revision="$GITHUB_SHA" \
            --source="$RELEASE_ROOT/source" \
            --inputs="$RELEASE_INPUTS"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only verified image IDs and verify registry digests
        id: publish
        run: |
          result="$(node scripts/ops/release-publish.mjs \
            --proof="${{ steps.produce.outputs.proof_path }}" \
            --proof-sha256="${{ steps.produce.outputs.proof_sha }}" \
            --revision="$GITHUB_SHA" \
            --source="$RELEASE_ROOT/source" \
            --inputs="$RELEASE_INPUTS" \
            --registry="${REGISTRY,,}" \
            --tag="$GITHUB_SHA" \
            --out="$RUNNER_TEMP/published-release-proof.json")"
          proof_sha="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).proof_sha256)' "$result")"
          printf 'proof_sha=%s\n' "$proof_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$result" > "$RUNNER_TEMP/published-release-result.json"

      - name: Upload release evidence for later deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: polutek-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/polutek-release/quality.json
            ${{ runner.temp }}/polutek-release/inputs.json
            ${{ runner.temp }}/polutek-release/source.tar
            ${{ runner.temp }}/published-release-proof.json
            ${{ runner.temp }}/published-release-result.json

      - name: Summary
        run: |
          {
            echo "### Verified images for \`$GITHUB_SHA\`"
            echo
            echo "Release proof SHA-256: \`${{ steps.publish.outputs.proof_sha }}\`"
            echo
            echo 'The artifact contains the proof, pinned inputs, quality report and exact source archive.'
            echo 'Deployment remains a separate reviewed operation.'
          } >> "$GITHUB_STEP_SUMMARY"
