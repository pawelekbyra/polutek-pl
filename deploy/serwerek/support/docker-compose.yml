# PP Support (wspolna skrzynka obslugi) na serwerku. Zyje na serwerze w /opt/serwerek/apps/pp-support/ (dane: /opt/serwerek/data/pp-support/).
# Uklad tam:  docker-compose.yml  .env (600, sekrety, NIE w repo)  overrides/ (nadpisania marki, ten katalog z repo)
# Wszystko slucha tylko na 127.0.0.1; droga publiczna: Cloudflare Tunnel -> 127.0.0.1:3010 (za Access).
# Runbook: docs/operations/SUPPORT-CENTER.md. Architektura: docs/architecture/support-center.md.
# Limity pamieci sa twarde: serwer ma 4 GB RAM i dzieli je z aplikacja, baza, Redisem i enkoderem wideo.
name: pp-support

x-pp-support: &pp-support
  image: pp-support:4.18.0 # lokalny tag obrazu opisanego w docs/operations/THIRD_PARTY_NOTICES.md (tam tez aktualizacja)
  restart: unless-stopped
  env_file: ./.env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - /opt/serwerek/data/pp-support/storage:/app/storage
    # Marka PP Support: pojedyncze pliki nadpisywane woluminami (read-only), zob. SUPPORT-CENTER.md "Marka".
    - ./overrides/config/schedule.yml:/app/config/schedule.yml:ro
    - ./overrides/config/locales/zz_pp_support.yml:/app/config/locales/zz_pp_support.yml:ro
    - ./overrides/views/super_admin/application/_javascript.html.erb:/app/app/views/super_admin/application/_javascript.html.erb:ro
    - ./overrides/views/super_admin/application/_navigation.html.erb:/app/app/views/super_admin/application/_navigation.html.erb:ro
    - ./overrides/views/super_admin/devise/sessions/new.html.erb:/app/app/views/super_admin/devise/sessions/new.html.erb:ro
    - ./overrides/views/mailers/account_notification/account_deletion_for_inactivity.liquid:/app/app/views/mailers/administrator_notifications/account_notification_mailer/account_deletion_for_inactivity.liquid:ro
    - ./overrides/views/mailers/account_notification/account_deletion_user_initiated.liquid:/app/app/views/mailers/administrator_notifications/account_notification_mailer/account_deletion_user_initiated.liquid:ro
    - ./overrides/views/mailers/account_compliance/account_deleted.liquid:/app/app/views/mailers/administrator_notifications/account_compliance_mailer/account_deleted.liquid:ro
    - ./overrides/public/brand-assets/logo.svg:/app/public/brand-assets/logo.svg:ro
    - ./overrides/public/brand-assets/logo_dark.svg:/app/public/brand-assets/logo_dark.svg:ro
    - ./overrides/public/brand-assets/logo_thumbnail.svg:/app/public/brand-assets/logo_thumbnail.svg:ro
    - ./overrides/public/manifest.json:/app/public/manifest.json:ro
    - ./overrides/public/android-icon-192x192.png:/app/public/android-icon-192x192.png:ro
  environment: &pp-support-env
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: "true"
    LOG_LEVEL: warn
    FRONTEND_URL: https://support.pawelperfect.com
    FORCE_SSL: "false"                        # TLS konczy Cloudflare; bez tego petla przekierowan
    ENABLE_ACCOUNT_SIGNUP: "false"
    DEFAULT_LOCALE: pl
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DATABASE: pp_support
    POSTGRES_USERNAME: pp_support
    REDIS_URL: redis://redis:6379
    ACTIVE_STORAGE_SERVICE: local
    # Pamiec: jeden proces puma, malo watkow; sidekiq z niska wspolbieznoscia.
    WEB_CONCURRENCY: "0"
    RAILS_MAX_THREADS: "3"
    SIDEKIQ_CONCURRENCY: "3"
    MALLOC_ARENA_MAX: "2"
    # Poczta przychodzaca: Cloudflare Email Worker -> POST do ingress Action Mailbox (relay).
    RAILS_INBOUND_EMAIL_SERVICE: relay
    MAILER_INBOUND_EMAIL_DOMAIN: inbound.pawelperfect.com
    # Poczta wychodzaca (systemowa): Resend SMTP. Haslo (klucz Resend) i nadawca w .env.
    SMTP_ADDRESS: smtp.resend.com
    SMTP_PORT: "587"                          # Hetzner blokuje 25 i 465 wychodzace; 587 (STARTTLS) dziala
    SMTP_USERNAME: resend
    SMTP_AUTHENTICATION: login
    SMTP_DOMAIN: pawelperfect.com
    SMTP_ENABLE_STARTTLS_AUTO: "true"
    SMTP_OPENSSL_VERIFY_MODE: peer
    MAILER_SENDER_EMAIL: "PP Support <support@pawelperfect.com>"
    # Bez telemetrii do serwerow producenta oprogramowania (metryki instancji, zdarzenia). Push mobilny: relay zostaje, zob. SUPPORT-CENTER.md.
    DISABLE_TELEMETRY: "true"

services:
  db:
    # pgvector jest wymagany przez migracje; produkcyjny Postgres strony go nie ma i go nie ruszamy. Baza i rola nazywaja sie pp_support (zmienione 2026-10-03, zob. SUPPORT-CENTER.md).
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pp_support
      POSTGRES_DB: pp_support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}      # z .env (compose czyta je automatycznie)
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - /opt/serwerek/data/pp-support/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pp_support -d pp_support"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  redis:
    # Osobny Redis (nie ten od aplikacji): Sidekiq wymaga noeviction, a ten od aplikacji ma allkeys-lru.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - /opt/serwerek/data/pp-support/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  web:
    <<: *pp-support
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3010:3000"
    mem_limit: 700m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  sidekiq:
    <<: *pp-support
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    mem_limit: 640m

  prepare:
    # Jednorazowo: docker compose --profile tools run --rm prepare   (migracje + seed przy pierwszym uruchomieniu)
    <<: *pp-support
    profiles: ["tools"]
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"] # nazwa zadania jest czescia silnika, nie do zmiany
    restart: "no"
    mem_limit: 900m
