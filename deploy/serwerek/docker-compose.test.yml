# TEST stack of the app on serwerek. Lives on the server in /opt/serwerek/apps/polutek-test/.
# Everything listens on 127.0.0.1 only; reach it with: ssh -L 3100:127.0.0.1:3000 serwerek
# DUMMY third-party values only. Never put real secrets here. See docs/operations/SERWEREK.md.
name: polutek-test

x-app-env: &app-env
  DATABASE_URL: postgresql://polutek:polutek_test@db:5432/polutek
  DATABASE_URL_UNPOOLED: postgresql://polutek:polutek_test@db:5432/polutek
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  BETTER_AUTH_SECRET: dummy-dummy-dummy-dummy-dummy-dummy-dummy-dummy
  MAIN_CREATOR_NAME: Test Creator
  ADMIN_EMAIL: admin@example.local
  EMAIL_UNSUBSCRIBE_SIGNING_SECRET: dummy-dummy-dummy-dummy-dummy-dummy-dummy
  HEALTHCHECK_TOKEN: dummy-health-token
  # No Redis REST creds: rate limiting falls back (see findings in SERWEREK.md).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polutek
      POSTGRES_PASSWORD: polutek_test
      POSTGRES_DB: polutek
    volumes:
      - /opt/serwerek/data/polutek-test/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polutek -d polutek"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # One-off: prisma migrate deploy + seed on the EMPTY local database.
    profiles: ["tools"]
    build:
      context: ./src
      dockerfile: deploy/serwerek/Dockerfile
      target: build
    image: polutek-tools:test
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]

  app:
    build:
      context: ./src
      dockerfile: deploy/serwerek/Dockerfile
    image: polutek-app:test
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1536m
