# PRODUCTION stack of www.pawelperfect.com on serwerek. Lives on the server in /opt/serwerek/apps/polutek/.
# Layout there:  docker-compose.yml  deploy.sh  app.env (600)  db.env (600)  src/ (git archive of the repo)
# No secrets in this file: everything secret is in app.env / db.env (root, 600, never committed).
# Everything listens on 127.0.0.1 only; the public path is Cloudflare Tunnel -> 127.0.0.1:3000.
# Tunnel ingress for www.pawelperfect.com must point at http://127.0.0.1:3000. Runbook: docs/operations/SERWEREK.md.
name: polutek

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./db.env            # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    # pg_stat_statements (query statistics for the admin panel): preloading needs a restart, done once by
    # scripts/serwerek/pg-stat-statements-enable.sh (SERWEREK.md section 23); keep this line identical to the one it writes.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    volumes:
      - /opt/serwerek/data/polutek/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  app:
    # APP_IMAGE is set by deploy.sh to polutek-app:<git-sha>; "current" is only the manual fallback.
    image: ${APP_IMAGE:-polutek-app:current}
    restart: unless-stopped
    env_file: ./app.env           # DATABASE_URL (host "db"), BETTER_AUTH_SECRET, GOOGLE_*, TURNSTILE_*, STRIPE_*, TRUST_CF_CONNECTING_IP=true, CRON_SECRET ...
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g

  encoder:
    # Own video pipeline worker: pulls encode jobs from Postgres, runs ffmpeg (nice 10), uploads HLS to R2.
    # Runbook: docs/operations/VIDEO-PIPELINE.md. A separate container (not the app process) so a long ffmpeg
    # run can be limited, restarted and rolled back on its own.
    # ENCODER_IMAGE is set by deploy.sh to polutek-worker:<sha>. Own env file with only what it needs (no Stripe/auth secrets).
    image: ${ENCODER_IMAGE:-polutek-worker:current}
    restart: unless-stopped
    env_file: ./worker.env        # DATABASE_URL (host "db"), CLOUDFLARE_R2_* (incl. _BUCKET_VIDEO_ORIGINALS, _BUCKET_HLS, _BUCKET_THUMBNAILS_PRIVATE), MAIN_CREATOR_SLUG, NEXT_PUBLIC_R2_PUBLIC_HOST
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/serwerek/data/video-work:/work   # chown 1000:1000; one original + its HLS output at a time, wiped per job
    init: true                    # reaps ffmpeg children
    stop_grace_period: 60s        # on stop the running job is handed back to the queue (no attempt used)
    mem_limit: 1500m              # SERWEREK.md section 14: ffmpeg needs ~300-500 MB; the limit is only a fuse
    cpu_shares: 256               # lower weight than app/db when the 2 vCPUs are contended (plus nice 10 inside)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  admin:
    # Admin panel (apps/admin), admin.pawelperfect.com. Profile "admin": NOT started by deploy.sh or a plain
    # `docker compose up`; only by deploy/serwerek/deploy-admin.sh (docker compose --profile admin ...).
    # Tunnel ingress admin.pawelperfect.com -> http://127.0.0.1:3100, behind a Cloudflare Access application.
    # Runbook: docs/operations/ADMIN-PANEL.md.
    profiles: ["admin"]
    image: ${ADMIN_IMAGE:-polutek-admin:current}
    restart: unless-stopped
    env_file: ./admin.env         # DATABASE_URL (host "db"), ADMIN_AUTH_SECRET, ADMIN_APP_URL, CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD ...
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      # Read-only status written by the host job deploy/serwerek/admin/host-status.py (no docker.sock in the panel).
      - /var/lib/serwerek/host-status:/host-status:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/apps/admin/.next/cache:size=32m,uid=1000,gid=1000
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 384m
    cpu_shares: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  collector:
    # pp-collector: anonymous analytics beacons forwarded by the app (POST /api/t), batch insert into the
    # Postgres schema "telemetry" as role pp_collector, rollups every 5 min, retention every 6 h.
    # No published port: only the app reaches it, at http://collector:3200 (TELEMETRY_COLLECTOR_URL in app.env).
    # Optional like the encoder: deploy.sh starts it only when collector.env exists. Docs: docs/architecture/admin-telemetry.md.
    image: ${COLLECTOR_IMAGE:-polutek-collector:current}
    restart: unless-stopped
    env_file: ./collector.env     # TELEMETRY_DATABASE_URL=postgresql://pp_collector:...@db:5432/<db>, TELEMETRY_ALLOWED_HOSTS=www.pawelperfect.com
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 96m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    # One-off, run by deploy.sh:  docker compose --profile tools run --rm migrate
    profiles: ["tools"]
    image: ${MIGRATOR_IMAGE:-polutek-migrator:current}
    env_file: ./app.env
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
