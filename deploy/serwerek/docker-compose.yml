# PRODUCTION stack of www.pawelperfect.com on serwerek. Lives on the server in /opt/serwerek/apps/polutek/.
# Layout there:  docker-compose.yml  deploy.sh  app.env (600)  db.env (600)  src/ (git archive of the repo)
# No secrets in this file: everything secret is in app.env / db.env (root, 600, never committed).
# Everything listens on 127.0.0.1 only; the public path is Cloudflare Tunnel -> 127.0.0.1:3000.
# Tunnel ingress for www.pawelperfect.com must point at http://127.0.0.1:3000. Runbook: docs/operations/SERWEREK.md.
name: polutek

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./db.env            # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    volumes:
      - /opt/serwerek/data/polutek/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  app:
    # APP_IMAGE is set by deploy.sh to polutek-app:<git-sha>; "current" is only the manual fallback.
    image: ${APP_IMAGE:-polutek-app:current}
    restart: unless-stopped
    env_file: ./app.env           # DATABASE_URL (host "db"), BETTER_AUTH_SECRET, GOOGLE_*, TURNSTILE_*, STRIPE_*, TRUST_CF_CONNECTING_IP=true, CRON_SECRET ...
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g

  encoder:
    # Own video pipeline worker: pulls encode jobs from Postgres, runs ffmpeg (nice 10), uploads HLS to R2.
    # Runbook: docs/operations/VIDEO-PIPELINE.md. A separate container (not the app process) so a long ffmpeg
    # run can be limited, restarted and rolled back on its own.
    # ENCODER_IMAGE is set by deploy.sh to polutek-worker:<sha>. Own env file with only what it needs (no Stripe/auth secrets).
    image: ${ENCODER_IMAGE:-polutek-worker:current}
    restart: unless-stopped
    env_file: ./worker.env        # DATABASE_URL (host "db"), CLOUDFLARE_R2_* (incl. _BUCKET_VIDEO_ORIGINALS, _BUCKET_HLS, _BUCKET_THUMBNAILS_PRIVATE), MAIN_CREATOR_SLUG, NEXT_PUBLIC_R2_PUBLIC_HOST
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/serwerek/data/video-work:/work   # chown 1000:1000; one original + its HLS output at a time, wiped per job
    init: true                    # reaps ffmpeg children
    stop_grace_period: 60s        # on stop the running job is handed back to the queue (no attempt used)
    mem_limit: 1500m              # SERWEREK.md section 14: ffmpeg needs ~300-500 MB; the limit is only a fuse
    cpu_shares: 256               # lower weight than app/db when the 2 vCPUs are contended (plus nice 10 inside)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  migrate:
    # One-off, run by deploy.sh:  docker compose --profile tools run --rm migrate
    profiles: ["tools"]
    image: ${MIGRATOR_IMAGE:-polutek-migrator:current}
    env_file: ./app.env
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
