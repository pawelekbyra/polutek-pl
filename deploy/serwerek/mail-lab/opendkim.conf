Syslog                  no
LogWhy                  yes
Mode                    s
Canonicalization        relaxed/relaxed
# One key (selector lab1, d=lab.pawelperfect.com) signs mail whose From is the lab subdomain or the app's
# sender domain. d=lab.pawelperfect.com is a subdomain of the From domain, so DKIM aligns under relaxed DMARC.
KeyTable                /etc/opendkim/key.table
SigningTable            refile:/etc/opendkim/signing.table
# Mail arrives from the private submission network, not only from loopback: sign it all.
InternalHosts           127.0.0.1, 172.16.0.0/12, 10.0.0.0/8
Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim
OversignHeaders         From
